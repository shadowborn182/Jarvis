services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: jarvis_lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512M
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    ports:
      - "2333:2333"

  jarvis-bot:
    build: .
    container_name: jarvis_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvis_secret_password}@postgres:5432/${POSTGRES_DB:-jarvis}
      LAVALINK_URI: http://lavalink:2333
    depends_on:
      postgres:
        condition: service_healthy
      lavalink:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./database/backups:/app/database/backups

  jarvis-dashboard:
    build: .
    container_name: jarvis_dashboard
    restart: unless-stopped
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:-jarvis_secret_password}@postgres:5432/${POSTGRES_DB:-jarvis}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jarvis_pgdata:
